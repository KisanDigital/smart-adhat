version: '3.8'

# Simple deployment with H2 in-memory database (good for testing/demo)
# For production with persistent database, use docker-compose.prod.yml

services:
  # Backend Spring Boot Application (with H2 in-memory database)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartadhat-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: c21hcnRhZGhhdHNlY3JldGtleWZvcmp3dHRva2VuZ2VuZXJhdGlvbjIwMjU=
      CORS_ORIGINS: http://localhost:4200,http://localhost
    networks:
      - smartadhat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Angular Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartadhat-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - smartadhat-network

networks:
  smartadhat-network:
    driver: bridge
